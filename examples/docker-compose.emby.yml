# Media Maid as a emby sidecar. One sidecar per media server (single tenant).
#
# Downloads and library live on the SAME volume (/data) so hardlinks work.
# emby only sees the library, mounted at /media, so SERVER_PATH_MAP
# translates /media -> /data/media for orphan detection.
services:
  emby:
    image: emby/embyserver:latest
    volumes:
      - emby-config:/config
      - /data/media:/media
    ports:
      - "8096:8096"
    restart: unless-stopped

  media-maid:
    build: ..                  # image built from this repository
    user: "1000:1000"            # owner of the files in /data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - /data:/data              # downloads + library (same filesystem)
    environment:
      INTEGRATION_MODE: emby
      MEDIA_SERVER_URL: http://emby:8096
      MEDIA_SERVER_TOKEN: ${MEDIA_SERVER_TOKEN:?}   # API key from Settings → Advanced → API Keys
      API_TOKEN: ${MEDIA_MAID_API_TOKEN:?}          # >= 32 characters (openssl rand -hex 32)
      DOWNLOADS_DIR: /data/downloads
      MOVIES_DIR: /data/media/movies
      TV_DIR: /data/media/tv
      SERVER_PATH_MAP: /media=/data/media
      # TMDB_API_KEY: ${TMDB_API_KEY}
      # PREFERRED_LANGUAGE: pt-BR
      # Optional LLM tie-breaker for ambiguous names (off when LLM_PROVIDER is empty):
      # LLM_PROVIDER: anthropic                    # or openai (also Ollama/LM Studio via LLM_BASE_URL)
      # LLM_API_KEY: ${LLM_API_KEY}
      # LLM_MODEL: claude-opus-5-5
      # ORPHAN_SCAN_INTERVAL: 24h
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [emby]
    restart: unless-stopped

volumes:
  emby-config:
