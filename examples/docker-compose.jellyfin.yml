# Media Maid as a jellyfin sidecar. One sidecar per media server (single tenant).
#
# Downloads and library live on the SAME volume (/data) so hardlinks work.
# jellyfin only sees the library, mounted at /media, so SERVER_PATH_MAP
# translates /media -> /data/media for orphan detection.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    volumes:
      - jellyfin-config:/config
      - /data/media:/media
    ports:
      - "8096:8096"
    restart: unless-stopped

  media-maid:
    image: ghcr.io/jfxdev/media-maid:latest   # pin a version (e.g. :1.2.3) in production
    # build: ..                                # or build from this repository
    user: "1000:1000"            # owner of the files in /data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - /data:/data              # downloads + library (same filesystem)
    environment:
      INTEGRATION_MODE: jellyfin
      MEDIA_SERVER_URL: http://jellyfin:8096
      MEDIA_SERVER_TOKEN: ${MEDIA_SERVER_TOKEN:?}   # API key from Dashboard → API Keys
      API_TOKEN: ${MEDIA_MAID_API_TOKEN:?}          # >= 32 characters (openssl rand -hex 32)
      STATE_DIR: /data/media-maid-state             # required: ledger, pending list, caches and history
      DOWNLOADS_DIR: /data/downloads
      MOVIES_DIR: /data/media/movies
      TV_DIR: /data/media/tv
      SERVER_PATH_MAP: /media=/data/media
      # TMDB_API_KEY: ${TMDB_API_KEY}
      # PREFERRED_LANGUAGE: pt-BR
      # Optional LLM tie-breaker for ambiguous names (off when LLM_PROVIDER is empty):
      # LLM_PROVIDER: anthropic                    # or openai (default gpt-6-luna; Ollama/LM Studio via LLM_BASE_URL + LLM_MODEL)
      # LLM_API_KEY: ${LLM_API_KEY}
      # LLM_MODEL: claude-haiku-5-5
      # ORPHAN_SCAN_INTERVAL: 24h
      # SCAN_INTERVAL: 15m                           # fallback when inotify misses events (NFS/SMB)
      # COPY_FALLBACK: "true"                        # copy (extra disk space) when hardlinks are impossible
      # ORGANIZE_TRIGGER: hook                       # recommended with qBittorrent 4.4+: organize only from its completion hook (qbittorrent-hook.sh)
      # AMBIGUOUS_MATCH: best                        # take TMDB's best candidate even when it is unsure
      # AUTO_UPGRADE: "true"                         # replace a release with a better one of the same title
      # LINK_EXTRAS: "false"                         # keep extras folders (Featurettes, Trailers...) out
      # NOTIFY_URL: ${NOTIFY_URL}                     # e.g. https://ntfy.sh/<topic> or http://apprise:8000/notify/<key>
      # NOTIFY_FORMAT: text                          # text for ntfy, json (default) for Apprise
      # NOTIFY_ON: conflict,error,skipped,upgraded
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [jellyfin]
    restart: unless-stopped

volumes:
  jellyfin-config:
