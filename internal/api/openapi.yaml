openapi: 3.1.0
info:
  title: Media Maid API
  version: 1.0.0
  summary: Organize downloads into a Jellyfin, Emby or Plex library and clean up orphans.
  description: |
    Every `/api/v1/*` route requires `Authorization: Bearer <API_TOKEN>`.
    Errors are returned as `{"error": "<code>"}` with a stable code.
  license:
    name: See LICENSE
    url: https://github.com/jfxdev/media-maid/blob/main/LICENSE
externalDocs:
  url: https://github.com/jfxdev/media-maid
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: organize
    description: Turn downloads into library entries.
  - name: sync
    description: Media server library refresh and history.
  - name: orphans
    description: Detect and remove stale library entries.
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe
      description: >-
        Answers 200 while the process serves requests and the downloads
        watcher is running; 503 when the watcher stopped or its event loop
        stalled for more than 30 seconds. A 200 with `"watcher": "degraded"`
        means some folders could not be watched (usually the inotify watch
        limit): a periodic scan covers them. With `ORGANIZE_TRIGGER=hook`
        there is no watcher and the probe only checks the process.
      operationId: health
      security: []
      responses:
        "200":
          description: The process and the watcher are up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  watcher: { type: string, const: degraded }
                required: [status]
        "503":
          description: The downloads watcher is not running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: unhealthy }
                  watcher: { type: string, const: stopped }
                required: [status, watcher]
  /api/v1/scan:
    post:
      tags: [organize]
      summary: Organize the whole downloads directory
      description: |
        Files already organized (recorded in the ledger) are not identified
        again, and a file whose library copy was deleted is left alone
        (`skipped`, not recorded in the history). One scan runs at a time.
      operationId: scan
      parameters:
        - name: async
          in: query
          required: false
          description: |
            `true` answers `202` at once; the outcome goes to the history
            (`GET /api/v1/history`).
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200": { $ref: "#/components/responses/Results" }
        "202":
          description: The scan started in the background.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: started }
                required: [status]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`scan_running`: another scan is in progress."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/organize:
    post:
      tags: [organize]
      summary: Organize one file or folder
      description: |
        `path` is relative to `DOWNLOADS_DIR` or absolute inside it.
        Handy as a qBittorrent "run external program" hook. An explicit
        request ignores the ledger: the files are identified again and
        re-linked even if their library copy was deleted.

        `kind` with `tmdb_id` and/or `title` (and `year`) replaces automatic
        identification for every video of the request (`resolved_by:
        manual`). When the file was placed before under another name, that
        earlier placement is removed once the new one is in place, but only
        while it still is the same file (`previous` names it). A placed
        manual identification is remembered for later files whose name reads
        the same way (same kind, title, year and origin marker).
      operationId: organize
      requestBody: { $ref: "#/components/requestBodies/PathRequest" }
      responses:
        "200": { $ref: "#/components/responses/Results" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/UnauthorizedVolume" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/MetadataUnavailable" }
  /api/v1/preview:
    post:
      tags: [organize]
      summary: Show where a file or folder would go, without touching disk
      operationId: preview
      requestBody: { $ref: "#/components/requestBodies/PathRequest" }
      responses:
        "200": { $ref: "#/components/responses/Results" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/UnauthorizedVolume" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/MetadataUnavailable" }
  /api/v1/pending:
    get:
      tags: [organize]
      summary: Downloads that need a decision
      description: |
        Videos that are not in the library because of a `conflict`, a
        `duplicate`, a title that could not be identified (`skipped`) or an
        `error`, oldest first. A compressed video release (RAR, ZIP, 7z)
        with no extracted video next to it is an `error` too: it must be
        extracted first. An item goes away when the file is placed
        (for example with a manual identification or `overwrite`) or leaves
        the downloads folder. Kept across restarts. With `NOTIFY_URL`, each
        new or changed item is notified once.
      operationId: pending
      responses:
        "200":
          description: Pending items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PendingItem" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/history:
    get:
      tags: [sync]
      summary: Recent actions (newest first) and the last sync outcome
      operationId: history
      responses:
        "200":
          description: Recent history (kept across restarts with `STATE_DIR`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryEntry" }
                  last_sync:
                    oneOf:
                      - { $ref: "#/components/schemas/SyncStatus" }
                      - { type: "null" }
                required: [entries, last_sync]
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sync:
    post:
      tags: [sync]
      summary: Trigger a library refresh on the media server now
      operationId: sync
      responses:
        "200":
          description: The media server accepted the refresh.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  watcher: { type: string, const: degraded }
                required: [status]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`sync_disabled`: no media server configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`sync_failed`: the media server rejected or did not answer the refresh."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orphans/scan:
    post:
      tags: [orphans]
      summary: Build a fresh orphan report (never removes anything)
      operationId: scanOrphans
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/orphans:
    get:
      tags: [orphans]
      summary: Latest orphan report
      operationId: getOrphans
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`no_report`: no scan has run yet."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orphans/remove:
    post:
      tags: [orphans]
      summary: Remove orphans from the current report
      description: |
        Each ID is revalidated first. IDs that are unknown or no longer
        orphans return `stale` and nothing is done for them.
      operationId: removeOrphans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
              required: [ids]
      responses:
        "200":
          description: One result per requested ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/RemoveResult" }
                required: [results]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `API_TOKEN` configured on the sidecar (at least 32 characters).
  requestBodies:
    PathRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                description: Relative to `DOWNLOADS_DIR`, or absolute inside it.
                examples: ["Inception.2010.1080p.BluRay.x264-GRP"]
              overwrite:
                type: boolean
                default: false
                description: |
                  Atomically replace an existing, different regular file at the
                  destination, or the same title under another video extension
                  (for example a 720p release with a 1080p one), instead of
                  reporting `conflict` or `duplicate`. Directories and symlinks
                  are never replaced, nor a file that changed after it was
                  checked. Requires a filesystem with atomic exchange
                  (renameat2); elsewhere the result is `error`. The watcher and
                  scans never overwrite; they upgrade only with `AUTO_UPGRADE`.
              kind:
                type: string
                enum: [movie, episode]
                description: |
                  Manual identification. Required with `title`, `year` or
                  `tmdb_id`. `episode` keeps the season and episode numbers
                  found in the name (a name without them is `skipped`).
              tmdb_id:
                type: integer
                minimum: 1
                maximum: 1073741824
                description: |
                  TMDB id of the movie or series; its title and year are used
                  unless `title` / `year` are given. Unknown ids answer
                  `tmdb_not_found`. Without `TMDB_API_KEY` it is only used as
                  the ID tag and `title` is required (`invalid_override`).
              title:
                type: string
                maxLength: 200
                description: |
                  Title to use. Without `tmdb_id` it is searched on TMDB (when
                  enabled) and used as typed when there is no confident match.
                  Sanitized before it becomes a folder name.
              year:
                type: integer
                minimum: 1870
                maximum: 2100
            required: [path]
  responses:
    Results:
      description: One result per source file.
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items: { $ref: "#/components/schemas/Result" }
            required: [results]
    Report:
      description: Orphan report.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Report" }
    BadRequest:
      description: "`invalid_request` (malformed JSON, unknown fields, duplicate keys, trailing data, body over 64 KiB), `invalid_path` or `invalid_override`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized`: missing or wrong bearer token."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnauthorizedVolume:
      description: "`unauthorized_volume`: the path links outside the mounted volumes."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: nothing exists at that path; `tmdb_not_found`: no TMDB entry with that `tmdb_id` and `kind`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MetadataUnavailable:
      description: "`metadata_unavailable`: TMDB could not be reached to check a manual identification."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "`internal_error`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_path
            - unauthorized
            - unauthorized_volume
            - not_found
            - invalid_override
            - tmdb_not_found
            - metadata_unavailable
            - no_report
            - sync_disabled
            - sync_failed
            - scan_running
            - internal_error
      required: [error]
    Result:
      type: object
      description: Outcome for a single source file.
      properties:
        source:
          type: string
          description: Path relative to `DOWNLOADS_DIR`.
        dest:
          type: string
          description: Destination inside the library.
        kind:
          type: string
          enum: [movie, episode, subtitle, extra]
          description: "`extra`: a video from a release's extras folder (`LINK_EXTRAS`)."
        status: { $ref: "#/components/schemas/OrganizeStatus" }
        error: { type: string }
        replaces:
          type: boolean
          description: On a `planned` result, the destination exists and would be replaced.
        previous:
          type: string
          description: |
            Library file this result removed (or would remove, in a preview):
            the release it upgraded or replaced under another extension, or
            the earlier placement of the same file corrected by a manual
            identification.
        resolved_by:
          type: string
          enum: [parser, tmdb, llm, manual]
          description: Layer that identified a video (see "How titles are resolved" in the README).
        title_source:
          type: string
          enum: [tmdb_translation, llm_localized, original]
          description: Origin of the folder title when `PREFERRED_LANGUAGE` is set.
      required: [source, status]
    OrganizeStatus:
      type: string
      enum: [linked, copied, replaced, upgraded, exists, conflict, duplicate, planned, skipped, error]
      description: |
        `linked` hardlink created; `copied` fallback when on another filesystem;
        `replaced` existing release replaced (only with `overwrite`);
        `upgraded` a lower-quality release placed by Media Maid replaced
        automatically (`AUTO_UPGRADE`); `exists` already in place; `conflict`
        the destination holds a file Media Maid did not place, or a release
        this one would upgrade while `AUTO_UPGRADE` is off; `duplicate` the
        title is already in the library (or in the same request) at the same
        or better quality (see `error`); `planned` preview/dry run; `skipped`
        not identified, an ambiguous TMDB match (`error` names the candidates;
        identify it manually), no matching video, or previously organized and since
        removed from (or replaced in) the library; `error` see `error` (a
        compressed release that must be extracted first is one). Two
        unidentified releases of equal quality under the same name are
        `conflict` rather than `duplicate`: they may be different titles.
    PendingItem:
      type: object
      properties:
        source:
          type: string
          description: Path relative to `DOWNLOADS_DIR`.
        dest: { type: string }
        kind:
          type: string
          enum: [movie, episode]
        status:
          type: string
          enum: [conflict, duplicate, skipped, error]
        error: { type: string }
        since: { type: string, format: date-time }
        updated: { type: string, format: date-time }
      required: [source, status, since, updated]
    HistoryEntry:
      type: object
      properties:
        time: { type: string, format: date-time }
        action:
          type: string
          enum: [organize, sync, orphan_remove]
        source: { type: string }
        dest: { type: string }
        status: { type: string }
        error: { type: string }
      required: [time, action, status]
    SyncStatus:
      type: object
      properties:
        time: { type: string, format: date-time }
        status:
          type: string
          enum: [ok, error]
        error: { type: string }
      required: [time, status]
    Report:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        server_check:
          type: string
          enum: [ok, disabled, error]
        orphans:
          type: array
          items: { $ref: "#/components/schemas/Orphan" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ReportError" }
      required: [generated_at, server_check, orphans]
    Orphan:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [server_item_missing_file, orphan_directory, unlinked_download]
          description: |
            `server_item_missing_file`: the media server lists the item but none of its
            files exist (removal checks the item's current paths first).
            `orphan_directory`: a library folder that is empty or holds only
            metadata (artwork, nfo, subtitles); any other file keeps it.
            `unlinked_download`: a downloaded video that is not in the library
            but still uses disk space (no other hard link, or its recorded
            library copy is gone); report-only (removal returns `error` /
            `not_removable`), the torrent client owns it.
        path:
          type: string
          description: Library path (`movies/...`, `tv/...`) or `downloads/...`.
        size:
          type: integer
          description: File size in bytes (`unlinked_download`).
        server_item_id: { type: string }
        title: { type: string }
        detected_at: { type: string, format: date-time }
      required: [id, type, path, detected_at]
    ReportError:
      type: object
      properties:
        server_item_id: { type: string }
        title: { type: string }
        error: { type: string }
      required: [error]
    RemoveResult:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [removed, stale, dry_run, error]
        error:
          type: string
          description: "`not_removable` for report-only types, `sync_disabled`, or the failure."
      required: [id, status]
